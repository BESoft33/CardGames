# Strings live in ARB files so more languages, such as Nepali, can be added
# later (AGENTS.md §5.10). Generated code goes next to the ARB files.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
nullable-getter: false
required-resource-attributes: true
format: true
