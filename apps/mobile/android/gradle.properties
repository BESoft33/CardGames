org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler stores plugin sources as paths relative to
# this folder. Flutter compiles plugins from the pub cache, which on Windows
# may be on another drive (here C: while the project is on D:), where no
# relative path exists, and the build fails with "this and base files have
# different roots" (docs/decisions.md D-034). The app's own Kotlin is one
# small file, so compiling it in full costs nothing.
kotlin.incremental=false
